<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 - Oops!</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f1724;
      color: #ffffff;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 8rem;
      margin: 0;
      color: #ffb86b;
      text-shadow: 4px 4px 0 #ff79c6;
      animation: bounce 2s infinite;
    }
    p {
      font-size: 1.5rem;
      margin-top: 1rem;
      color: #cbe7ff;
    }
    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% {
        transform: translateY(0);
      }
      40% {
        transform: translateY(-20px);
      }
      60% {
        transform: translateY(-10px);
      }
    }
    a {
      margin-top: 2rem;
      display: inline-block;
      background: #ffb86b;
      color: #0f1724;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.3s;
    }
    a:hover {
      background: #ffd9a6;
    }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Looks like you took a wrong turn — even Google Maps can't save you now! 🗺️😂</p>
  <a href="/">Take me home!</a>
</body>
</html>
